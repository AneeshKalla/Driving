<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Analysis Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Driving Analysis Tool</h1>
            <p>Upload a driving video to analyze for incidents and get AI-powered feedback</p>
        </header>

        <div class="upload-section">
            <input type="file" id="videoInput" accept="video/*" />
            <button id="uploadBtn" onclick="uploadVideo()">Upload Video</button>
            <div id="uploadStatus"></div>
        </div>

        <div id="videoSection" class="hidden">
            <div class="video-container">
                <video id="videoPlayer" controls>
                    <source id="videoSource" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="timeline-container">
                <div id="timeline" class="timeline">
                    <div id="timelineBar" class="timeline-bar"></div>
                </div>
                <div class="timeline-labels">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button id="analyzeBtn" onclick="analyzeVideo()">Analyze Video</button>
                <div id="analysisStatus"></div>
            </div>

            <div id="resultsSection" class="hidden">
                <div class="results-grid">
                    <div class="result-panel dino-panel">
                        <h2>DINO Detection Results</h2>
                        <div id="dinoResults" class="result-content"></div>
                    </div>

                    <div class="result-panel gemini-panel">
                        <h2>Gemini Analysis</h2>
                        <div id="geminiResults" class="result-content"></div>
                    </div>
                </div>

                <div class="incident-details">
                    <h3>Selected Incident</h3>
                    <div id="incidentDetails" class="incident-content">
                        <p>Click on a marker in the timeline to view details</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
